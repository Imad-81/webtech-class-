<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                background-image: url('images.jpeg')
            }
        </style>
    </head>
    <body>
        <h2 style="color: blue">
            Background Image
        </h2>
        <p style="color:red">
            By default, the background image will repeat itself
            if it is smaller than the element where it is specified,
            in this case the body element
        </p>
    </body>
</html>
